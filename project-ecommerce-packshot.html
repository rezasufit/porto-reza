    <script>
        document.addEventListener("DOMContentLoaded", function() {
                    // 1. DATA BRAND: Tambahkan brand baru beserta foldernya di sini
                    const portfolioData = [{
                            brandName: "Provus",
                            folderPath: "packshot/provus", // Sesuai contoh kamu, ini pakai folder sufit
                            totalImages: 9,
                            shopeeLink: "https://shopee.co.id/provusofficial"
                        }, {
                            brandName: "Susufitnessku 1",
                            folderPath: "packshot/sufit-tangerang", // Ganti nama folder jika ada folder khusus susufitnessku
                            totalImages: 9,
                            shopeeLink: "https://shopee.co.id/susufitnessku_tangerang"
                        }, {
                            brandName: "Susufitnessku 2",
                            folderPath: "packshot/sufit", // Ganti nama folder jika ada folder khusus susufitnessku
                            totalImages: 9,
                            shopeeLink: "https://shopee.co.id/susufitnessku"
                        },
                        //     brandName: "Leanlatte",
                        //     folderPath: "leanlatte", // Ganti nama folder jika ada folder khusus susufitnessku
                        //     totalImages: 6,
                        //     shopeeLink: "https://shopee.co.id/leanlatte.id"
                        // }, {
                        {
                            brandName: "Strongman",
                            folderPath: "packshot/strongman", // Ganti nama folder jika ada folder khusus susufitnessku
                            totalImages: 9,
                            shopeeLink: "https://shopee.co.id/strongman_9"
                        },
                    ];

                    const container = document.getElementById('portfolio-container');
                    let htmlContent = '';

                    // 2. LOOPING DATA & RENDER HTML
                    portfolioData.forEach(brand => {
                                // MODIFIED: Render Judul Brand dan Ikon Shopee (jika ada) menggunakan struktur Flexbox yang rapi
                                htmlContent += `
                <section class="single-page-hero-area">
                    <div class="container">
                        <div class="row align-items-center text-center">
                            <div class="col-lg-12">
                                <div class="brand-header-flex">
                                    <h2>${brand.brandName}</h2>
                                    ${brand.shopeeLink ? `<a href="${brand.shopeeLink}" target="_blank" rel="noopener noreferrer" class="brand-shopee-icon"><i class="ri-shopping-bag-line"></i></a>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <div class="projects-area" style="padding-top: 0; padding-bottom: 80px;">
                    <div class="container-fluid">
                        <div class="row g-4 portfolio-grid">`;

                // Render Gambar Portfolio secara menurun murni (dari totalImages ke 1)
                for (let i = brand.totalImages; i >= 1; i--) {
                    let categoryClass = (i % 2 === 0) ? "category-2" : "category-1";
                    let imagePath = `assets/images/projects/${brand.folderPath}/${i}.webp`;

                    htmlContent += `
                            <div class="col-md-6 col-xl-4 portfolio-item ${categoryClass}">
                                <a href="${imagePath}" class="work-popup">
                                    <div class="portfolio-box">
                                        <img src="${imagePath}" alt="${brand.brandName} Post ${i}" data-rjs="2">
                                    </div>
                                </a>
                            </div>`;
                }

                htmlContent += `
                        </div>
                    </div>
                </div>`;
            });

            // 3. MASUKKAN KE DALAM DOM
            container.innerHTML = htmlContent;

            // 4. RE-INITIALIZE MAGNIFIC POPUP (Agar fitur klik gambar (zoom) tetap jalan)
            if ($.fn.magnificPopup) {
                $('.work-popup').magnificPopup({
                    type: 'image',
                    gallery: {
                        enabled: true
                    },
                    mainClass: 'mfp-fade'
                });
            }
        });
    </script>
