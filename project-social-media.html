    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. DATA BRAND: Tambahkan brand baru beserta foldernya di sini
            const portfolioData = [{
                brandName: "Provus",
                folderPath: "provus", // Sesuai contoh kamu, ini pakai folder sufit
                totalImages: 12
            }, {
                brandName: "Susufitnessku",
                folderPath: "sufit", // Ganti nama folder jika ada folder khusus susufitnessku
                totalImages: 9
            }, {
                brandName: "Leanlatte",
                folderPath: "leanlatte", // Ganti nama folder jika ada folder khusus susufitnessku
                totalImages: 6
            }, {
                brandName: "Strongman",
                folderPath: "strongman", // Ganti nama folder jika ada folder khusus susufitnessku
                totalImages: 12
            }, ];

            const container = document.getElementById('portfolio-container');
            let htmlContent = '';

            // 2. LOOPING DATA & RENDER HTML
            portfolioData.forEach(brand => {
                // Render Judul Brand
                htmlContent += `
                <section class="single-page-hero-area" style="padding-bottom: 20px;">
                    <div class="container">
                        <div class="row align-items-center text-center">
                            <div class="col-lg-12">
                                <h2>${brand.brandName}</h2>
                            </div>
                        </div>
                    </div>
                </section>
                
                <div class="projects-area" style="padding-top: 0; padding-bottom: 80px;">
                    <div class="container-fluid">
                        <div class="row g-4 portfolio-grid">`;

                // Render Gambar Portfolio sesuai jumlah totalImages
                for (let i = 1; i <= brand.totalImages; i++) {
                    let categoryClass = (i % 2 === 0) ? "category-2" : "category-1";
                    let imagePath = `assets/images/projects/${brand.folderPath}/${i}.webp`;

                    htmlContent += `
                            <div class="col-md-6 col-xl-4 portfolio-item ${categoryClass}">
                                <a href="${imagePath}" class="work-popup">
                                    <div class="portfolio-box">
                                        <img src="${imagePath}" alt="${brand.brandName} Post ${i}" data-rjs="2">
                                        <span class="portfolio-category">Feed</span>
                                    </div>
                                </a>
                            </div>`;
                }

                htmlContent += `
                        </div>
                    </div>
                </div>`;
            });

            // 3. MASUKKAN KE DALAM DOM
            container.innerHTML = htmlContent;

            // 4. RE-INITIALIZE MAGNIFIC POPUP (Agar fitur klik gambar (zoom) tetap jalan)
            if ($.fn.magnificPopup) {
                $('.work-popup').magnificPopup({
                    type: 'image',
                    gallery: {
                        enabled: true
                    },
                    mainClass: 'mfp-fade'
                });
            }
        });
    </script>
